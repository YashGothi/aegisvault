name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build -t ghcr.io/yashgothi/aegisvault-backend:${{ github.sha }} -t ghcr.io/yashgothi/aegisvault-backend:latest ./backend

      - name: Build frontend image
        run: |
          docker build -t ghcr.io/yashgothi/aegisvault-frontend:${{ github.sha }} -t ghcr.io/yashgothi/aegisvault-frontend:latest ./frontend

      - name: Start full stack with docker compose
        run: docker compose up -d

      - name: Wait for containers to be ready
        run: sleep 15

      - name: Health check - backend
        run: |
          curl -s -o /dev/null -w "%{http_code}" http://localhost:8000 | grep -qE "^[2-4][0-9][0-9]$" && echo "Backend is up" || (echo "Backend not responding" && exit 1)

      - name: Health check - frontend
        run: curl --fail http://localhost:3000 || exit 1

      - name: Push backend image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/yashgothi/aegisvault-backend:${{ github.sha }}
          docker push ghcr.io/yashgothi/aegisvault-backend:latest

      - name: Push frontend image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/yashgothi/aegisvault-frontend:${{ github.sha }}
          docker push ghcr.io/yashgothi/aegisvault-frontend:latest

      - name: Show logs on failure
        if: failure()
        run: docker compose logs